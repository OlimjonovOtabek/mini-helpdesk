<p-dialog
  [header]="header()"
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: '440px' }"
>
  <p class="message">{{ message() }}</p>

  <ng-template #footer>
    <p-button [label]="cancelLabel()" severity="secondary" [text]="true" (onClick)="cancel()" />
    <p-button [label]="confirmLabel()" severity="danger" (onClick)="confirm()" />
  </ng-template>
</p-dialog>
